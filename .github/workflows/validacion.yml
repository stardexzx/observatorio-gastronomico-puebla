name: Validación del observatorio

on:
  push:
    branches: [prueba]
  pull_request:
    branches: [prueba]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observatorio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CHROMIUM_PATH: /usr/bin/chromium
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias del proyecto
        run: npm ci
      - name: Instalar el navegador de pruebas
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import subprocess
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              subprocess.run(['sudo', 'ln', '-sf', playwright.chromium.executable_path, '/usr/bin/chromium'], check=True)
          PY
      - name: Pruebas de lógica
        run: npm test
      - name: Revisar el código
        run: npm run lint
      - name: Compilar
        run: npm run build
      # El runner genera credenciales y un contenedor desechable propios;
      # no recibe secretos ni se conecta a una base instalada del usuario.
      - name: Integración con PostgreSQL y navegador
        run: node tests/public_smoke.mjs --production
