name: Guías de la versión instalada
on:
  push:
    branches: [proteccion-legal]
    paths: ['.github/workflows/lectura-guias.yml']
permissions:
  contents: read
jobs:
  leer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Leer las guías exigidas por AGENTS.md
        run: |
          node --input-type=module - <<'JS'
          import { readFile, readdir } from 'node:fs/promises';
          const root = 'node_modules/next/dist/docs/';
          const files = await readdir(root, {recursive:true});
          const suffixes = ['05-server-and-client-components.md', 'route.md', 'cookies.md'];
          for (const suffix of suffixes) {
            const file = files.find(file => file.endsWith(suffix));
            if (!file) throw new Error('No se encontró la guía: ' + suffix);
            console.log('\nGUIDE_START ' + file + '\n' + await readFile(root+file,'utf8') + '\nGUIDE_END');
          }
          JS
