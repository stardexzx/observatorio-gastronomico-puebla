name: ogp_unificado
services:
  db:
    image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
    environment:
      POSTGRES_DB: observatorio_puebla_test
      POSTGRES_USER: ogp_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta npm run configurar primero}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - ogp_unificado_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
volumes:
  ogp_unificado_data:
    name: ogp_unificado_data
